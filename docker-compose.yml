services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=2).status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Vite dev server proxy → service-discovery name on the compose
      # network. Match this with vite.config.ts (VITE_API_TARGET).
      VITE_API_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_started
